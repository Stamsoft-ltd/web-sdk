<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<style>
			/* External fonts — @import is non-blocking and fails silently when the host blocks external requests */
			@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=EB+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap');
			@import url('https://use.typekit.net/aba0ebl.css');
			/* Fill the FULL dynamic viewport so the canvas (and its background) always reaches the
			   bottom edge on mobile — 100% chains break when the browser URL bar shows/hides, leaving
			   the black body visible below the game. 100dvh tracks the visible viewport. */
			html, body { height: 100%; }
			body > div { width: 100%; height: 100dvh; }
		</style>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no"
		/>
		%sveltekit.head%
	</head>
	<body style="margin: 0; padding: 0; overflow: hidden; background-color: black">
		<div>%sveltekit.body%</div>
	</body>
</html>
