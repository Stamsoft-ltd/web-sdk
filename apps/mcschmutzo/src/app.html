<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<style>
			/* Fonts are SELF-HOSTED (static/fonts/web) — Stake Engine requires all assets to load
			   from the game's own CDN paths with no external runtime requests; the previous Google
			   Fonts / Typekit imports rendered system-font fallbacks wherever external hosts are
			   blocked. Cinzel is one variable file covering weights 400–900. */
			@font-face {
				font-family: 'Cinzel';
				font-style: normal;
				font-weight: 400 900;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/web/cinzel.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Poppins';
				font-style: normal;
				font-weight: 400;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/web/poppins-400.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Poppins';
				font-style: normal;
				font-weight: 500;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/web/poppins-500.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Poppins';
				font-style: normal;
				font-weight: 600;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/web/poppins-600.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Poppins';
				font-style: normal;
				font-weight: 700;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/web/poppins-700.woff2') format('woff2');
			}
			/* Splash card copy: Bowlby One (titles) + Nunito (descriptions). */
			@font-face {
				font-family: 'Bowlby One';
				font-style: normal;
				font-weight: 400;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/web/bowlby-one.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Nunito';
				font-style: normal;
				font-weight: 400 700;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/web/nunito-500.woff2') format('woff2');
			}
			/* Fill the FULL dynamic viewport so the canvas (and its background) always reaches the
			   bottom edge on mobile — 100% chains break when the browser URL bar shows/hides, leaving
			   the black body visible below the game. 100dvh tracks the visible viewport. */
			html, body { height: 100%; }
			body > div { width: 100%; height: 100dvh; }
		</style>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no"
		/>
		%sveltekit.head%
	</head>
	<body style="margin: 0; padding: 0; overflow: hidden; background-color: black">
		<div>%sveltekit.body%</div>
	</body>
</html>
