<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<style>
			/* The game's typefaces (design): Bowlby One SC — the main/display face (titles, values,
			   buttons) — Nunito — the secondary face (labels, body copy) — and Luckiest Guy for the big
			   amounts on the confirm pop-ups (latin only: amounts are digits + currency signs).
			   SELF-HOSTED (static/fonts/web): Stake Engine requires all assets to load from the game's own
			   CDN paths with no external runtime requests. Nunito is the variable font (weights 200–1000)
			   split into Google Fonts' unicode-range subsets, so only the scripts in use download. */
			@font-face {
				font-family: 'Bowlby One SC';
				font-style: normal;
				font-weight: 400;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/web/bowlby-one-sc.woff2') format('woff2');
			}
			/* Story Script (OFL, story-script-OFL.txt) = the design's display face for splash titles,
			   pop-up headers, buttons and the free-spin congrats copy. Everything that uses it goes through
			   --font-brush. Story Script has no Cyrillic/Arabic/Devanagari/CJK, so
			   those scripts fall through to Bowlby One SC / the system face.
			   The design gives every brush line a same-colour OUTSIDE stroke of ~1/45 of its size (1 px at
			   42–48 px, 0.5 px at 20–24 px): --brush-stroke is that as a centred CSS stroke (twice as wide,
			   the inner half hidden under the fill). */
			:root {
				--font-brush: 'Story Script', 'Bowlby One SC', sans-serif;
				--brush-stroke: 0.045em;
			}
			@font-face {
				font-family: 'Story Script';
				font-style: normal;
				font-weight: 400;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/web/story-script-latin.woff2') format('woff2');
				unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
			}
			@font-face {
				font-family: 'Story Script';
				font-style: normal;
				font-weight: 400;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/web/story-script-latin-ext.woff2') format('woff2');
				unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
			}
			@font-face {
				font-family: 'Story Script';
				font-style: normal;
				font-weight: 400;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/web/story-script-vietnamese.woff2') format('woff2');
				unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
			}
			@font-face {
				font-family: 'Luckiest Guy';
				font-style: normal;
				font-weight: 400;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/web/luckiest-guy-latin.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Nunito';
				font-style: normal;
				font-weight: 200 1000;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/web/nunito-var-latin.woff2') format('woff2');
				unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
			}
			@font-face {
				font-family: 'Nunito';
				font-style: normal;
				font-weight: 200 1000;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/web/nunito-var-latin-ext.woff2') format('woff2');
				unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
			}
			@font-face {
				font-family: 'Nunito';
				font-style: normal;
				font-weight: 200 1000;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/web/nunito-var-cyrillic.woff2') format('woff2');
				unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
			}
			@font-face {
				font-family: 'Nunito';
				font-style: normal;
				font-weight: 200 1000;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/web/nunito-var-cyrillic-ext.woff2') format('woff2');
				unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;
			}
			@font-face {
				font-family: 'Nunito';
				font-style: normal;
				font-weight: 200 1000;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/web/nunito-var-vietnamese.woff2') format('woff2');
				unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
			}
			/* Base face for any text without its own (the shared GlobalStyle sets an unloaded
			   'proxima-nova' on body — `html body` outranks it). */
			html body { font-family: 'Nunito', sans-serif; }
			/* Fill the FULL dynamic viewport so the canvas (and its background) always reaches the
			   bottom edge on mobile — 100% chains break when the browser URL bar shows/hides, leaving
			   the black body visible below the game. 100dvh tracks the visible viewport. */
			html, body { height: 100%; }
			body > div { width: 100%; height: 100dvh; }
		</style>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no"
		/>
		%sveltekit.head%
	</head>
	<body style="margin: 0; padding: 0; overflow: hidden; background-color: black">
		<!-- Fetch the faces at startup, so they're ready before the pixi canvas text first renders
		     (canvas Text doesn't re-render when a font finishes loading). Off-screen but rendered. -->
		<span
			aria-hidden="true"
			style="position: absolute; left: -9999px; top: 0; font-family: 'Bowlby One SC'; font-weight: 400"
			>AUTO SPIN 0123456789$.,×</span
		>
		<span
			aria-hidden="true"
			style="position: absolute; left: -9999px; top: 0; font-family: 'Nunito'; font-weight: 700"
			>TURBO SPIN 0123456789</span
		>
		<span
			aria-hidden="true"
			style="position: absolute; left: -9999px; top: 0; font-family: 'Story Script'; font-weight: 400"
			>AUTO SPIN 0123456789$.,</span
		>
		<div>%sveltekit.body%</div>
	</body>
</html>
